<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual">
<title>주둥이 댄스</title>
<meta name="description" content="아무 말이나 입력하면 무표정한 아저씨가 헬륨 목소리로 외치며 춤을 춥니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gaegu:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="입력한 말에 맞춰 춤추는 무표정한 아저씨" role="img"></canvas>
    <h1>주둥이 <mark>댄스</mark></h1>
    <div id="jamo" aria-hidden="true"></div>
    <div id="sub"></div>
  </div>
  <form id="f">
    <label class="say" for="say">아무 말이나 쳐봐. 느낌표!!!를 많이 붙일수록 난리 난다.</label>
    <textarea id="say" maxlength="300">이 곳에 하고 싶은 말을 입력해 보세요~~</textarea>
    <div class="row">
      <button id="go" type="submit" disabled>목 푸는 중</button>
    </div>
    <div class="row sub-row">
      <button id="record" type="button">영상 저장</button>
      <button id="share" type="button">사이트 공유</button>
    </div>
    <button id="enter" type="button">광장 입장</button>
    <div id="msg" role="status"></div>
  </form>
  <details id="rules"><summary>광장 규칙</summary>
    <p class="rule">광장에서는 다른 사람의 외침이 그대로 들립니다. 욕은 기본으로 삐 처리되고, 성적인 말, 혐오 표현, 개인정보, 링크는 전송되지 않습니다. 금칙어 검사가 모든 공격을 막지는 못하니 불쾌한 외침은 음소거나 신고를 눌러 주세요. 규칙을 읽었다면 광장 입장을 한 번 더 누르세요.</p></details>
  <details><summary>목소리 만들기</summary>
    <div id="presets" class="chips"></div>
    <div id="sliders" class="sliders"></div>
    <div class="dress-tools"><button id="voiceTest" type="button">들어보기</button><button id="voiceSave" type="button">내 목소리 저장</button></div></details>
  <p class="found" id="found"></p>
  <footer>음성 합성: <a href="https://github.com/espeak-ng/espeak-ng">eSpeak NG</a> (GPL-3.0). 이 사이트의 <a href="https://github.com/hahasuminher/jujungi-dance">소스 코드</a>는 GPL-3.0으로 공개되어 있습니다. 혼자 모드의 입력은 브라우저 안에서만 처리됩니다.</footer>
</div>
<div id="plazaUi">
  <div id="plazaTop"><strong id="roomInfo"></strong><span class="top-r"><button id="zOut" type="button" aria-label="축소">-</button><button id="zIn" type="button" aria-label="확대">+</button><button id="setBtn" type="button">설정</button></span></div>
  <div id="setMenu" hidden><button id="beep" type="button" aria-pressed="true">욕 삐 처리 켬</button><button id="allHear" type="button" aria-pressed="false">전체 듣기 끔</button><label for="volume">볼륨<input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label><small id="pLag"></small><strong>목소리</strong><div id="pVoices" class="chips"></div><button id="leave" type="button">광장 나가기</button></div>
  <div id="peerMenu" hidden><strong id="peerName"></strong><button id="peerMute" type="button">음소거</button><button id="peerReport" type="button">신고</button></div>
  <div id="pMsg" role="status"></div>
  <div id="clubOpen" class="pop" hidden><strong>주둥이 클럽 열기</strong><label for="clubIn">클럽에서 반복할 말</label><input id="clubIn" maxlength="30" placeholder="30자까지, 비속어 금지" autocomplete="off"><div id="clubThemes" class="chips"><button class="chip" type="button" data-t="edm" aria-pressed="true">EDM</button><button class="chip" type="button" data-t="hiphop" aria-pressed="false">힙합</button><button class="chip" type="button" data-t="disco" aria-pressed="false">디스코</button><button class="chip" type="button" data-t="trot" aria-pressed="false">트로트</button></div><div class="pop-row"><button id="clubGo" type="button">초대 보내기</button><button id="clubCancel" type="button">닫기</button></div></div>
  <div id="clubInvite" class="pop" hidden><strong>클럽 초대장</strong><span id="clubText"></span><div class="pop-row"><button id="clubYes" type="button">입장</button><button id="clubNo" type="button">거절</button></div></div>
  <button id="clubExit" type="button">클럽 나가기</button>
  <button id="aSing" type="button" hidden>노래하기</button>
  <button id="aPick" type="button" hidden></button>
  <div id="singOpen" class="pop" hidden><strong>주둥이 노래방</strong><div id="singSongs" class="chips"></div><small id="singBy"></small><label for="singIn">가사 (짧으면 곡이 끝날 때까지 반복)</label><textarea id="singIn" maxlength="120" rows="3"></textarea><div class="pop-row"><button id="singGo" type="button">노래 시작</button><button id="singCancel" type="button">닫기</button></div></div>
  <div id="dock"><div class="reacts"><button type="button" data-react="ㅋㅋㅋ">ㅋㅋㅋ</button><button type="button" data-react="박수">박수</button><button type="button" data-react="야유">야유</button><button type="button" data-react="하트">하트</button></div>
   <div class="acts"><button id="aSit" type="button" aria-pressed="false">앉기</button><button id="aLie" type="button" aria-pressed="false">눕기</button><button id="aRide" type="button" aria-pressed="false">업히기</button><button id="aTrain" type="button" aria-pressed="false">기차</button><button id="aBanana" type="button">바나나</button><button id="aClub" type="button">클럽</button></div>
   <form id="pForm"><input id="pIn" maxlength="120" enterkeyhint="send" placeholder="광장에 외칠 말" autocomplete="off" aria-label="광장에 외칠 말"><button type="submit">외치기</button></form></div>
</div>
<script src="boot.js"></script>
</body>
</html>
