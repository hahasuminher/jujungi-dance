<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>음성 시험</title><meta name="robots" content="noindex">
<style>body{margin:0 auto;max-width:560px;padding:16px;background:#fff;color:#0d0d0d;font:700 18px/1.5 system-ui,sans-serif}h1{font-size:26px;margin:8px 0 14px}h2{font-size:20px;margin:18px 0 0}textarea{box-sizing:border-box;width:100%;min-height:92px;padding:10px;font:inherit;border:3px solid #0d0d0d;border-radius:10px}.b{display:grid;gap:10px;margin-top:12px}button{min-height:52px;font:inherit;background:#f4ff1f;border:3px solid #0d0d0d;border-radius:12px}button.ai{background:#ff2bb3;color:#fff}button:disabled{opacity:.5}select{font:inherit;padding:6px;border:3px solid #0d0d0d;border-radius:8px}label{display:flex;gap:10px;align-items:center;margin-top:12px}#m{min-height:3em;margin-top:14px;color:#555;overflow-wrap:anywhere}small{color:#555;font-weight:400}</style></head>
<body><h1>음성 시험</h1><textarea id="t" maxlength="80" aria-label="시험 문장">오늘 점심 뭐 먹을지 진짜 고민된다. 주둥이 댄스 한판 하자!</textarea>
<label>언어 값 <select id="l"><option value="kr">kr</option><option value="ko">ko</option><option value="KR">KR</option></select></label>
<h2>기존 음성 다듬기</h2><div class="b"><button id="c" disabled>0. 지금 음성</button><button id="v1" disabled>1. 살짝 또렷</button><button id="v2" disabled>2. 또렷 + 천천히</button><button id="v3" disabled>3. 또렷 + 단어 끊어 읽기</button><button id="v4" disabled>4. 또렷 + 덜 쪼꼬미</button></div>
<h2>AI 음성 망가뜨리기</h2><div class="b"><button id="a" class="ai">5. AI 기본</button><button id="h" class="ai">6. AI 쪼꼬미</button><button id="r" class="ai">7. AI 고장난 로봇</button><button id="w" class="ai">8. AI 울렁 헬륨</button></div>
<div id="m" role="status">목소리 불러오는 중…</div><small>시험용 페이지입니다. 입력한 문장은 음성 생성을 위해 서버로 전송됩니다.</small>
<script>const SPECIALS={};</script><script src="vendor/espeak-ng.js"></script><script src="hangul.js"></script><script src="bgm.js"></script><script src="voice.js"></script>
<script>
const $=i=>document.getElementById(i),m=$('m'),au=new Audio();au.setAttribute('playsinline','');let url='',key='';
function wav(p,sr){const n=p.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,p[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}
const VS=[{...VOICE_DEFAULT,pitch:78,rate:124,range:80,speed:1.26},{...VOICE_DEFAULT,pitch:78,rate:108,range:80,speed:1.26},{...VOICE_DEFAULT,pitch:78,rate:118,range:80,speed:1.26},{...VOICE_DEFAULT,pitch:66,rate:118,range:72,speed:1.14}];
bootVoice().then(()=>{for(const i of['c','v1','v2','v3','v4'])$(i).disabled=false;m.textContent='준비됐어요. 같은 문장으로 비교해 보세요.'}).catch(e=>{m.textContent='지금 음성을 불러오지 못했어요.'});
function play(u,rate){au.src=u;au.preservesPitch=false;au.webkitPreservesPitch=false;au.playbackRate=rate;au.play().catch(e=>{m.textContent='재생 실패: '+e.message})}
$('c').onclick=()=>{const t0=performance.now(),s=buildSpeech($('t').value,VOICE_DEFAULT,{plain:true});const ms=Math.round(performance.now()-t0);if(!s.text)return;play(URL.createObjectURL(wav(s.pcm,SR)),1);m.textContent=`지금 음성: 합성 ${ms}ms`};
async function ai(rate){const k=$('l').value+'|'+$('t').value;if(k===key&&url){play(url,rate);m.textContent='AI 음성: 저장된 소리 재생';return}for(const b of['a','h','r','w'])$(b).disabled=true;m.textContent='AI 음성 만드는 중…';const t0=performance.now();try{const r=await fetch('/api/tts-test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:$('t').value,lang:$('l').value})}),j=await r.json();if(!r.ok||!j.audio){m.textContent='실패: '+(j.error||r.status)+(j.keys?' '+j.keys:'');return}const bin=atob(j.audio),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const head=String.fromCharCode(u[0],u[1],u[2],u[3]),ty=head==='RIFF'?'audio/wav':'audio/mpeg';url=URL.createObjectURL(new Blob([u],{type:ty}));key=k;play(url,rate);m.textContent=`AI 음성: 전체 ${Math.round(performance.now()-t0)}ms (서버 생성 ${j.ms}ms), ${Math.round(u.length/1024)}KB`}catch(e){m.textContent='실패: '+e.message}finally{for(const b of['a','h','r','w'])$(b).disabled=false}}
function clear(p){const o=new Float32Array(p.length);let pk=0;for(let i=1;i<p.length;i++){o[i]=p[i]-.62*p[i-1];pk=Math.max(pk,Math.abs(o[i]))}const k=.92/(pk||1);for(let i=0;i<o.length;i++)o[i]*=k;return o}
VS.forEach((v,i)=>{$('v'+(i+1)).onclick=()=>{const t=i===2?$('t').value.replace(/\s+/g,', '):$('t').value,t0=performance.now(),s=buildSpeech(t,v,{plain:true});if(!s.text)return;play(URL.createObjectURL(wav(clear(s.pcm),SR)),1);m.textContent=`${i+1}번: 합성 ${Math.round(performance.now()-t0)}ms`}});
async function fx(mode){if(!url||key!==$('l').value+'|'+$('t').value){await ai(1);au.pause()}if(!url)return;const ac=new (window.AudioContext||window.webkitAudioContext)(),b=await ac.decodeAudioData(await (await fetch(url)).arrayBuffer()),sr=b.sampleRate,x=b.getChannelData(0),ratio=mode==='w'?1.42:1.08,n=Math.floor(x.length/ratio),o=new Float32Array(n+sr);let sp=0,op=0;while(sp<x.length-1&&op<o.length-1){const i=sp|0,e=sp-i;let v=x[i]+(x[i+1]-x[i])*e;const t=op/sr;if(mode==='r')v=v*.25+v*.75*Math.sin(2*Math.PI*88*t);o[op++]=Math.tanh(v*1.6);sp+=ratio*(mode==='w'?1+.13*Math.sin(2*Math.PI*6.2*t):1)}ac.close();play(URL.createObjectURL(wav(o.subarray(0,op),sr)),1);m.textContent=mode==='r'?'7번: AI 로봇':'8번: AI 울렁 헬륨'}
$('a').onclick=()=>ai(1);$('h').onclick=()=>ai(1.45);$('r').onclick=()=>fx('r');$('w').onclick=()=>fx('w');
</script></body></html>
