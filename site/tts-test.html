<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>음성 시험</title><meta name="robots" content="noindex">
<style>body{margin:0 auto;max-width:560px;padding:16px;background:#fff;color:#0d0d0d;font:700 18px/1.5 system-ui,sans-serif}h1{font-size:26px;margin:8px 0 14px}textarea{box-sizing:border-box;width:100%;min-height:92px;padding:10px;font:inherit;border:3px solid #0d0d0d;border-radius:10px}.b{display:grid;gap:10px;margin-top:12px}button{min-height:52px;font:inherit;background:#f4ff1f;border:3px solid #0d0d0d;border-radius:12px}button.ai{background:#ff2bb3;color:#fff}button:disabled{opacity:.5}select{font:inherit;padding:6px;border:3px solid #0d0d0d;border-radius:8px}label{display:flex;gap:10px;align-items:center;margin-top:12px}#m{min-height:3em;margin-top:14px;color:#555;overflow-wrap:anywhere}small{color:#555;font-weight:400}</style></head>
<body><h1>음성 시험</h1><textarea id="t" maxlength="80" aria-label="시험 문장">오늘 점심 뭐 먹을지 진짜 고민된다. 주둥이 댄스 한판 하자!</textarea>
<label>언어 값 <select id="l"><option value="kr">kr</option><option value="ko">ko</option><option value="KR">KR</option></select></label>
<div class="b"><button id="c" disabled>지금 음성 (헬륨 쪼꼬미)</button><button id="a" class="ai">AI 음성 (기본)</button><button id="h" class="ai">AI 음성 + 헬륨</button><button id="d" class="ai">AI 음성 + 저음</button></div>
<div id="m" role="status">목소리 불러오는 중…</div><small>시험용 페이지입니다. 입력한 문장은 음성 생성을 위해 서버로 전송됩니다.</small>
<script>const SPECIALS={};</script><script src="vendor/espeak-ng.js"></script><script src="hangul.js"></script><script src="bgm.js"></script><script src="voice.js"></script>
<script>
const $=i=>document.getElementById(i),m=$('m'),au=new Audio();au.setAttribute('playsinline','');let url='',key='';
function wav(p,sr){const n=p.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,p[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}
bootVoice().then(()=>{$('c').disabled=false;m.textContent='준비됐어요. 같은 문장으로 비교해 보세요.'}).catch(e=>{m.textContent='지금 음성을 불러오지 못했어요.'});
function play(u,rate){au.src=u;au.preservesPitch=false;au.webkitPreservesPitch=false;au.playbackRate=rate;au.play().catch(e=>{m.textContent='재생 실패: '+e.message})}
$('c').onclick=()=>{const t0=performance.now(),s=buildSpeech($('t').value,VOICE_DEFAULT,{plain:true});const ms=Math.round(performance.now()-t0);if(!s.text)return;play(URL.createObjectURL(wav(s.pcm,SR)),1);m.textContent=`지금 음성: 합성 ${ms}ms`};
async function ai(rate){const k=$('l').value+'|'+$('t').value;if(k===key&&url){play(url,rate);m.textContent='AI 음성: 저장된 소리 재생';return}for(const b of['a','h','d'])$(b).disabled=true;m.textContent='AI 음성 만드는 중…';const t0=performance.now();try{const r=await fetch('/api/tts-test',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:$('t').value,lang:$('l').value})}),j=await r.json();if(!r.ok||!j.audio){m.textContent='실패: '+(j.error||r.status)+(j.keys?' '+j.keys:'');return}const bin=atob(j.audio),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const head=String.fromCharCode(u[0],u[1],u[2],u[3]),ty=head==='RIFF'?'audio/wav':'audio/mpeg';url=URL.createObjectURL(new Blob([u],{type:ty}));key=k;play(url,rate);m.textContent=`AI 음성: 전체 ${Math.round(performance.now()-t0)}ms (서버 생성 ${j.ms}ms), ${Math.round(u.length/1024)}KB`}catch(e){m.textContent='실패: '+e.message}finally{for(const b of['a','h','d'])$(b).disabled=false}}
$('a').onclick=()=>ai(1);$('h').onclick=()=>ai(1.28);$('d').onclick=()=>ai(.82);
</script></body></html>
